apiVersion: v1
kind: ConfigMap
metadata:
  name: notifygatewaysvc-config
data:
  .env: |-
    SECURITY_BASIC_ENABLED=true
    RABBITMQ_HOST=$(RABBIT_HOST)
    RABBITMQ_PORT=$(RABBIT_PORT)
    SPRING_DATASOURCE_URL=jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)
    LIQUIBASE_URL=jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)
    LIQUIBASE_USER=$(DB_USERNAME)
    LIQUIBASE_PASSWORD=$(DB_PASSWORD)
    SPRING_DATASOURCE_USERNAME=$(DB_USERNAME)
    SPRING_DATASOURCE_PASSWORD=$(DB_PASSWORD)
    SPRING_ZIPKIN_ENABLED=true
    SPRING_ZIPKIN_BASEURL=http://$(ZIPKIN_SERVICE_HOST):$(ZIPKIN_SERVICE_PORT)/
