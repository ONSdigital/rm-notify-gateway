sudo: required

services:
  - docker

language: java
jdk: openjdk8

env:
  global:
    - SOURCE_IMAGE_NAME="notifygatewaysvc"
    - DESTINATION_IMAGE_NAME="$DOCKER_GCP_LOCATION/census-rm-notifygatewaysvc"

before_install: "cp .maven.settings.xml $HOME/.m2/settings.xml"

script:
  - "mvn fmt:check verify"

after_success:
  - if [ "$TRAVIS_BRANCH" == "rm-census" ] && [ "$TRAVIS_PULL_REQUEST" == "false" ]; then
    docker login -u "${DOCKER_GCP_USERNAME}" -p "${DOCKER_GCP_PASSWORD}" "${DOCKER_GCP_REGISTRY}";
    docker tag "$SOURCE_IMAGE_NAME" "$DESTINATION_IMAGE_NAME";
    docker push "$DESTINATION_IMAGE_NAME";
    fi

cache:
  directories:
    - $HOME/.m2

branches:
  only:
    - rm-census
