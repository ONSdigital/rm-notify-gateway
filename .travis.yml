sudo: required

services:
  - docker

language: java
jdk: openjdk8

before_install: "cp .maven.settings.xml $HOME/.m2/settings.xml"

script:
  - "mvn fmt:check verify"

after_success:
  - if ([ "$TRAVIS_BRANCH" == "rm-census" ] && [ "$TRAVIS_PULL_REQUEST" == "false" ]) || ([ "$TRAVIS_BRANCH" == "automate-census-docker-build" ]); then
    docker login -u "${DOCKER_GCP_USERNAME}" -p "${DOCKER_GCP_PASSWORD}" "${DOCKER_GCP_REGISTRY}";
    docker tag notifygatewaysvc "${DOCKER_GCP_LOCATION}"/notifygatewaysvc;
    docker push "${DOCKER_GCP_LOCATION}"/notifygatewaysvc;
    fi

cache:
  directories:
    - $HOME/.m2

branches:
  only:
    - rm-census
    - automate-census-docker-build